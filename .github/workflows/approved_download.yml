name: ARGUS Approved Download

on:
  repository_dispatch:
    types: [approved_download]
  workflow_dispatch:
    inputs:
      url:
        description: 'URL книги для скачивания'
        required: true
      candidate_id:
        description: 'ID кандидата (short_id из кнопки)'
        required: false
        default: 'manual'
      title:
        description: 'Название (опционально)'
        required: false
        default: 'manual download'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests==2.32.3

      - name: Run approve handler
        env:
          APPROVE_URL: ${{ github.event.client_payload.url || github.event.inputs.url }}
          APPROVE_ID: ${{ github.event.client_payload.candidate_id || github.event.inputs.candidate_id }}
          APPROVE_TITLE: ${{ github.event.client_payload.title || github.event.inputs.title }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd scripts
          python approve_handler.py

      - name: Commit
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "ARGUS: approved download $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main || true
          git push || true