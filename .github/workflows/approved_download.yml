name: ARGUS Approved Download

on:
  repository_dispatch:
    types: [approved_download]
  workflow_dispatch:
    inputs:
      url:
        description: 'URL книги для скачивания'
        required: true
      candidate_id:
        description: 'ID кандидата (short_id из кнопки)'
        required: false
        default: 'manual'
      title:
        description: 'Название (опционально)'
        required: false
        default: 'manual download'

permissions:
  contents: write

concurrency:
  group: argus-download
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests==2.32.3

      - name: Ensure books/ tracked
        run: |
          echo "=== Проверяю books/ ==="
          ls -la books/ || echo "books/ нет"
          if [ ! -f books/.gitkeep ]; then
            touch books/.gitkeep
            echo "✅ создан books/.gitkeep"
          fi
          echo "=== git ls-files books/ (до download) ==="
          git ls-files books/ || true

      - name: Run approve handler
        env:
          APPROVE_URL: ${{ github.event.client_payload.url || github.event.inputs.url }}
          APPROVE_ID: ${{ github.event.client_payload.short_id || github.event.client_payload.candidate_id || github.event.inputs.candidate_id }}
          APPROVE_TITLE: ${{ github.event.client_payload.title || github.event.inputs.title }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/approve_handler.py

      - name: Diagnose after download
        run: |
          echo "=== Содержимое books/ после download ==="
          ls -la books/
          echo "=== Размер папки books/ ==="
          du -sh books/ || true
          echo "=== git status (короткий) ==="
          git status --short

      - name: Commit and Push changes
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"

          # force-add: игнорируем возможный .gitignore
          git add -f books/
          git add -f data/pending_cards.json data/sent_candidates.json data/scout_candidates.json || true

          echo "=== git status --short (staged) ==="
          git status --short

          echo "=== git diff --staged --stat ==="
          git diff --staged --stat || true

          if git diff --staged --quiet; then
            echo "⚠️ НЕТ изменений для коммита. books/ вероятно пустая или .gitignore блокирует."
            exit 0
          fi

          echo "Есть изменения. Коммичу и пушу..."
          git commit -m "ARGUS: скачана книга [skip ci]"

          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "✅ Успешно отправлено в репозиторий"
              break
            else
              echo "⚠️ Попытка $i не удалась, жду 5 секунд..."
              sleep 5
            fi
          done

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"⚠️ <b>ARGUS:</b> approved_download упал. Проверь логи Actions.\", \"parse_mode\": \"HTML\"}"