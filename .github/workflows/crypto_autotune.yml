# ============================================================
# ARGUS - Autotune (weekly)
# ------------------------------------------------------------
# Перебирает параметры LightGBM.
# Сохраняет best_params.json для train.py.
# Cron-job.org: 0 3 * * 0 (Вс 03:00 UTC)
# ============================================================

name: Crypto Autotune

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: argus-crypto-autotune
  cancel-in-progress: false

jobs:
  autotune:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-learn-${{ hashFiles('crypto/requirements.txt') }}
          restore-keys: pip-learn-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r crypto/requirements.txt

      - name: Autotune
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto/learn/autotune.py

      - name: Commit
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add crypto/learn/models/best_params.json || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "autotune: best params [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs \
              --autostash origin main || true
            if git push origin main; then
              break
            fi
            sleep 5
          done