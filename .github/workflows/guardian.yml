name: ARGUS Guardian

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим: snapshot / test / rollback'
        required: true
        default: 'test'

permissions:
  contents: write

concurrency:
  group: argus-guardian
  cancel-in-progress: false

jobs:
  guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v3

      - name: Install CPU torch
        run: |
          pip install torch==2.2.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install sentence-transformers==3.0.1
          pip install faiss-cpu==1.8.0
          pip install transformers==4.41.2
          pip install numpy==1.26.4
          pip install requests==2.32.3  # Добавлено для Telegram-уведомлений из guardian.py

      - name: Run guardian
        run: python scripts/guardian.py "${{ github.event.inputs.mode }}"

      - name: Commit and Push changes
        if: github.event.inputs.mode == 'test' || github.event.inputs.mode == 'snapshot'
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          
          # Сохраняем результаты тестов и/или новые снимки
          git add data/quality.json data/snapshots/ || true
          
          if git diff --staged --quiet; then
            echo "Нет изменений для коммита."
            exit 0
          fi
          
          echo "Есть изменения. Коммичу и пушу..."
          git commit -m "ARGUS: guardian ${{ github.event.inputs.mode }} [skip ci]"
          
          # Надежный пуш с обработкой конфликтов
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "✅ Данные Guardian успешно сохранены"
              break
            else
              echo "⚠️ Попытка $i не удалась, жду 5 секунд..."
              sleep 5
            fi
          done
