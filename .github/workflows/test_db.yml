# ============================================================
# ARGUS — TEST DB CONNECTION (временный)
# Проверяет, что секрет ARGUS_DB_URL работает.
# После проверки — удалить.
# ============================================================

name: Test DB Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install psycopg
        run: pip install "psycopg[binary]==3.2.3"

      - name: Test connection
        env:
          DB_URL: ${{ secrets.ARGUS_DB_URL }}
        run: |
          python3 << 'PYEOF'
          import os
          import sys
          import psycopg

          url = os.environ.get("DB_URL", "").strip()
          if not url:
              print("❌ ARGUS_DB_URL пустой. Секрет не задан.")
              sys.exit(1)

          if "[YOUR-PASSWORD]" in url or "YOUR-PASSWORD" in url:
              print("❌ В строке остался placeholder [YOUR-PASSWORD]. Вставь реальный пароль.")
              sys.exit(1)

          # Маскируем пароль для логов
          safe_url = url
          try:
              at = safe_url.rfind("@")
              scheme = safe_url.find("://")
              colon = safe_url.find(":", scheme + 3)
              if at > colon > 0:
                  safe_url = safe_url[:colon + 1] + "***" + safe_url[at:]
          except Exception:
              pass

          print(f"🔗 Подключаюсь: {safe_url}")

          try:
              with psycopg.connect(url, connect_timeout=15) as conn:
                  with conn.cursor() as cur:
                      cur.execute("SELECT NOW(), version(), current_database(), current_user")
                      row = cur.fetchone()
                      print("")
                      print("✅ ПОДКЛЮЧЕНИЕ УСПЕШНО!")
                      print(f"   Время сервера: {row[0]}")
                      print(f"   БД: {row[2]}")
                      print(f"   Юзер: {row[3]}")
                      print(f"   Версия: {row[1][:60]}...")

                      # Проверим, есть ли pgvector
                      cur.execute("SELECT extname FROM pg_extension WHERE extname = 'vector'")
                      vec = cur.fetchone()
                      if vec:
                          print("   ✅ pgvector установлен — можно хранить эмбеддинги")
                      else:
                          print("   ⚠️ pgvector НЕ установлен (пока не критично)")

          except psycopg.OperationalError as e:
              print(f"")
              print(f"❌ ОШИБКА ПОДКЛЮЧЕНИЯ: {e}")
              print("")
              print("Возможные причины:")
              print("  1. Пароль в ARGUS_DB_URL неверный или не заменён")
              print("  2. В пароле есть спецсимволы (@, :, /, #) — надо percent-encode")
              print("  3. Проект на Supabase в статусе Paused")
              print("  4. Host/port указаны неверно")
              sys.exit(1)

          except Exception as e:
              print(f"❌ Неизвестная ошибка: {e}")
              sys.exit(1)
          PYEOF