name: crypto - proba_exchanges

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run probe
        run: |
          python crypto/probe_exchanges.py

      - name: Show summary
        if: always()
        run: |
          if [ -f crypto/data/exchange_probe.json ]; then
            python -c "import json; d=json.load(open('crypto/data/exchange_probe.json')); s=d.get('summary',{}); print('Метрик:', s.get('total_metrics_available',0)); print('Объём за месяц МБ:', s.get('total_mb_per_month_all',0))"
          else
            echo "Отчёт не создан"
          fi

      - name: Commit report
        if: always()
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add crypto/data/exchange_probe.json || true
          if git diff --staged --quiet; then
            echo "Нет изменений для коммита"
          else
            git commit -m "crypto: probe exchanges"
            git pull --rebase origin main || echo "rebase failed"
            git push origin main || echo "push failed"
          fi