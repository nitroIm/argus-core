name: Feature Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r crypto/requirements.txt
      - name: Run audit
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          ARGUS_DB_URL_2: ${{ secrets.ARGUS_DB_URL_2 }}
          SYMBOLS: BTCUSDT
          DB2_SYMBOLS: SOLUSDT,BNBUSDT
          HORIZON: '12'
        run: python crypto/learn/audit.py