# ============================================================
# ARGUS - вечерний техотчёт
# ------------------------------------------------------------
# 18:00 UTC = 20:00 КЛГ
# ============================================================

name: ARGUS Evening Report

on:
  workflow_dispatch:
  # schedule:
    # - cron: '0 18 * * *'

permissions:
  contents: read

concurrency:
  group: argus-evening-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3
          pip install "psycopg[binary]==3.2.3"

      - name: Run report
        env:
          ARGUS_DB_URL: >-
            ${{ secrets.ARGUS_DB_URL }}
          TELEGRAM_BOT_TOKEN: >-
            ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: >-
            ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto/report/evening.py

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: >-
            ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: >-
            ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \
                 \"text\": \"Evening упал\", \
                 \"parse_mode\": \"HTML\"}" || true