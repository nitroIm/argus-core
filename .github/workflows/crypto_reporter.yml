# ============================================================
# ARGUS-Trader — WEEKLY REPORTER
# ------------------------------------------------------------
# Воскресенье 11:00 UTC = 13:00 КЛГ
# ------------------------------------------------------------
# v3: time 13:00 КЛГ + ARGUS_DB_URL_2.
# ============================================================

name: ARGUS Crypto Reporter

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 0'

permissions:
  contents: read

concurrency:
  group: argus-crypto-reporter
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r crypto/requirements.txt

      - name: Run weekly
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          ARGUS_DB_URL_2: ${{ secrets.ARGUS_DB_URL_2 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto/report/weekly.py

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"Weekly crypto упал\", \"parse_mode\": \"HTML\"}" || true