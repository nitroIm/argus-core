# ============================================================
# ARGUS-Trader — TEST NEWS ANALYZER v2
# ------------------------------------------------------------
# Временный тест news.py с полным набором зависимостей
# (torch + transformers + sentencepiece для перевода).
# После успеха — УДАЛИТЬ.
# ============================================================

name: Test News Analyzer

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-news-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: pip-news-

      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-argus-models-v1
          restore-keys: hf-

      - name: Install dependencies (полный стек)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
                      -r scripts/requirements.txt

      - name: Check translate import
        run: |
          cd scripts
          python -c "
          try:
              import torch
              print(f'✅ torch {torch.__version__}')
          except Exception as e:
              print(f'❌ torch: {e}')

          try:
              from translate import translate_to_ru, is_english
              print('✅ translate.py импортирован')
              test = 'Bitcoin breaks \$85K resistance'
              print(f'Test: {test}')
              print(f'Result: {translate_to_ru(test)}')
          except Exception as e:
              print(f'❌ translate: {e}')
          "

      - name: Test news analyzer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto/collect/news.py