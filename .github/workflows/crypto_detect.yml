name: ARGUS Crypto Detect

on:
  workflow_dispatch:
  schedule:
    - cron: '30 * * * *'

permissions:
  contents: read

concurrency:
  group: argus-crypto-detect
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-crypto-${{ hashFiles('crypto/requirements.txt') }}
          restore-keys: pip-crypto-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crypto/requirements.txt

      - name: Run anomaly detectors
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto/detect/anomaly.py

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"⚠️ <b>ARGUS Crypto Detect</b> упал.\", \"parse_mode\": \"HTML\"}" || true