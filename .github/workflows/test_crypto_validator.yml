name: Test Crypto Validator

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test priority
        run: python crypto/collect/priority.py

      - name: Test validator
        run: python crypto/collect/validator.py