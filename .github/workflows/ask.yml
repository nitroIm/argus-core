name: ARGUS Ask

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Вопрос'
        required: true
        default: 'Что такое Новая Атлантида?'
      chat_id:
        description: 'Telegram chat_id'
        required: false
        default: ''

  repository_dispatch:
    types: [run_search]

permissions:
  contents: write

concurrency:
  group: argus-ask
  cancel-in-progress: false

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v3

      - name: Install CPU torch
        run: |
          pip install torch==2.2.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install sentence-transformers==3.0.1
          pip install faiss-cpu==1.8.0
          pip install transformers==4.41.2
          pip install sentencepiece==0.2.0
          pip install sacremoses==0.1.1
          pip install requests==2.32.3
          pip install numpy==1.26.4

      - name: Run ask
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QUERY: ${{ github.event.inputs.query || github.event.client_payload.query }}
          CHAT_ID: ${{ github.event.inputs.chat_id || github.event.client_payload.chat_id }}
        run: python scripts/ask.py "$QUERY"

      - name: Commit logs
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add logs/ || true
          git diff --staged --quiet && echo "Нет новых логов" && exit 0
          git commit -m "ARGUS: новые логи [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            git push && break
            sleep 5
          done