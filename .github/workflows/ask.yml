name: ARGUS Ask

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Вопрос'
        required: true
        default: 'Что такое Новая Атлантида?'
  repository_dispatch:
    types: [run_search]

permissions:
  contents: write

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ask-v2
          restore-keys: pip-ask-

      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v2
          restore-keys: hf-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.0"
          pip install torch==2.2.0 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.41.2 sentence-transformers==3.0.1 faiss-cpu==1.8.0 requests

      - name: Run ask
        env:
          QUERY: ${{ github.event.client_payload.query || github.event.inputs.query }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd scripts
          python ask.py

      - name: Commit logs
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "ARGUS: ask $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main || true
          git push || true