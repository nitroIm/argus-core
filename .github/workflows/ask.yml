name: ARGUS Ask

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Вопрос'
        required: true
        default: 'Что такое Новая Атлантида?'
  repository_dispatch:
    types: [run_search]

permissions:
  contents: write

concurrency:
  group: argus-ask
  cancel-in-progress: false

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ask-v3
          restore-keys: pip-ask-

      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v3
          restore-keys: hf-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.0"
          pip install torch==2.2.0 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.41.2 sentence-transformers==3.0.1 faiss-cpu==1.8.0 requests==2.32.3 sentencepiece sacremoses

      - name: Run ask
        env:
          QUERY: ${{ github.event.client_payload.query || github.event.inputs.query }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/ask.py

      - name: Commit logs
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          
          # Безопасно коммитим только папку с логами, чтобы не зацепить лишнее
          git add logs/ || true
          
          if git diff --staged --quiet; then
            echo "Нет изменений в логах."
            exit 0
          fi
          
          echo "Есть новые логи. Коммичу..."
          git commit -m "ARGUS: ask log [skip ci]"
          
          # Надежный пуш с обработкой конфликтов
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "✅ Логи успешно отправлены"
              break
            else
              echo "⚠️ Попытка $i не удалась, жду 5 секунд..."
              sleep 5
            fi
          done
