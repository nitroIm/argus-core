# ============================================================
# ARGUS - NEWS COLLECT
# ------------------------------------------------------------
# Только сбор новостей в news_sentiment.json.
# cron-job.org дёргает каждый час.
# ============================================================

name: ARGUS News Collect

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: argus-news-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Collect news
        run: python crypto/collect/news.py

      - name: Commit
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          # ИСПРАВЛЕНИЕ: Добавляем всю папку news, где теперь лежат файлы
          git add crypto/data/news/ || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "ARGUS: news collect [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              break
            fi
            sleep 5
          done

      # ==========================================
      # УНИВЕРСАЛЬНАЯ ЗАЩИТА ОТ ПАДЕНИЙ
      # ==========================================
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"⚠️ <b>Сбой в: ${{ github.workflow }}</b>\nПроверь логи в GitHub Actions!\", \"parse_mode\": \"HTML\"}" || true