name: Crypto Backtest (BTC 1H)

on:
  workflow_dispatch:
    inputs:
      notional:
        description: 'Размер одной сделки в $ (Notional)'
        required: true
        default: '100'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Установка совместимой библиотеки pandas-ta-classic
          pip install pandas pyarrow fastparquet pandas-ta-classic numpy

      - name: Run backtest
        env:
          BT_NOTIONAL: ${{ inputs.notional }}
          BT_BALANCE: '1000'
        run: python crypto/collect/backtest.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: crypto/collect/backtest_results.json
          if-no-files-found: warn