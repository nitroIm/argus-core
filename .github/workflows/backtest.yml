name: Crypto Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r crypto/requirements.txt

      - name: Run backtest
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          ARGUS_DB_URL_2: ${{ secrets.ARGUS_DB_URL_2 }}
          SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
          DB2_SYMBOLS: SOLUSDT,BNBUSDT
          HORIZON: '12'
          USE_CROSS: '0'
          USE_EXTERNAL: '0'
        run: python crypto/learn/backtest.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: crypto/learn/backtest_results.json
          if-no-files-found: warn