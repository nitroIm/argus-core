name: Crypto Backtest

on:
  workflow_dispatch:
    inputs:
      notional:
        description: 'Размер сделки в $'
        required: true
        default: '100'

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow fastparquet numpy
          
      - name: Run backtest
        env:
          BT_NOTIONAL: ${{ inputs.notional }}
          BT_BALANCE: '1000'
        run: python crypto/learn/backtest.py
          
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: crypto/learn/backtest_results.json
          if-no-files-found: warn