name: Crypto Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow fastparquet numpy
      - name: Run backtest
        env:
          BT_NOTIONAL: '20'
          BT_BALANCE: '100'
        run: python crypto/learn/backtest.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          # Исправленный путь к файлу
          path: crypto/learn/grid_search_results.json
          if-no-files-found: warn