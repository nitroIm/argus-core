name: ARGUS Evening News (Groups)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: argus-news-evening
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests "psycopg[binary]"

      - name: Report news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          # NEWS_TEST_MODE: "1"
        run: python crypto/report/evening_news_report.py

      - name: Commit
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add crypto/data/news/ || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "ARGUS: evening news sent history [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push origin main; then break; fi
            sleep 5
          done

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"⚠️ <b>Сбой в: ${{ github.workflow }}</b>\nПроверь логи в GitHub Actions!\", \"parse_mode\": \"HTML\"}" || true