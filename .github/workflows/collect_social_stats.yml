name: ARGUS Social Collector

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests telethon

      - name: Run Collector
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
        run: python crypto/collect/collect_social_stats.py

      - name: Save history
        run: |
          git config user.name "ARGUS Stats"
          git config user.email "stats@github.com"
          git add crypto/data/social_stats/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Update social stats [skip ci]"
          git pull --rebase --autostash origin main || true
          git push origin main