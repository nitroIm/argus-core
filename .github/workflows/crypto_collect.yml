# ============================================================
# ARGUS-Trader — COLLECT (прод)
# ------------------------------------------------------------
# Запускается каждый час. Собирает 6 метрик BTC + ETH
# и пишет в Supabase. Ничего не коммитит в git.
# ------------------------------------------------------------
# v1: начальная версия
# ============================================================

name: ARGUS Crypto Collect

on:
  workflow_dispatch:
  schedule:
    # Каждый час в 0 минут (UTC)
    - cron: '0 * * * *'

permissions:
  contents: read

concurrency:
  group: argus-crypto-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-crypto-${{ hashFiles('crypto/requirements.txt') }}
          restore-keys: pip-crypto-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crypto/requirements.txt

      - name: Run pipeline
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto/collect/pipeline.py

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"⚠️ <b>ARGUS Crypto Collect</b> упал. Проверь Actions.\", \"parse_mode\": \"HTML\"}" || true