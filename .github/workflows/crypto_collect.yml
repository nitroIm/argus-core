# ============================================================
# ARGUS-Trader — COLLECT (прод, инкрементальный)
# ------------------------------------------------------------
# v2: инкрементальный режим — 3 записи за раз.
#     Время прогона: ~15-30 секунд вместо 8 минут.
# ============================================================

name: ARGUS Crypto Collect

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим (incremental / backfill)'
        required: false
        default: 'incremental'
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

concurrency:
  group: argus-crypto-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-crypto-${{ hashFiles('crypto/requirements.txt') }}
          restore-keys: pip-crypto-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crypto/requirements.txt

      - name: Run pipeline
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          echo "Mode: $MODE"
          python crypto/collect/pipeline.py --mode=$MODE

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"⚠️ <b>ARGUS Crypto Collect</b> упал.\", \"parse_mode\": \"HTML\"}" || true