# ============================================================
# ARGUS - COLLECT
# ------------------------------------------------------------
# v2: коммитит crypto/data/coingecko_cache.json
# ============================================================

name: ARGUS Crypto Collect

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'incremental или backfill'
        required: false
        default: 'incremental'
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: argus-crypto-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-crypto-${{ hashFiles('crypto/requirements.txt') }}
          restore-keys: pip-crypto-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r crypto/requirements.txt

      - name: Run pipeline
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          echo "Mode: $MODE"
          python crypto/collect/pipeline.py --mode=$MODE

      - name: Commit cache
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add crypto/data/ || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "ARGUS: cache update [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "Push OK"
              break
            fi
            echo "Retry $i"
            sleep 5
          done