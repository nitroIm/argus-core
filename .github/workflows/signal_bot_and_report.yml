name: ARGUS Signal Bot & Report

on:
  workflow_dispatch: 

permissions:
  contents: write

concurrency:
  group: argus-signal-engine
  cancel-in-progress: false

jobs:
  run_signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas "psycopg[binary]" requests

      # 1. Ищем сигнал и пишем в JSON (лежит в signals)
      - name: Run Signal Bot
        env:
          AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
        run: python crypto/signals/signal_bot.py

      # 2. Читаем JSON и отправляем в TG (лежит в report)
      - name: Run Signal Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto/report/signal_bot_report.py

      # 3. Сохраняем обновленный статус
      - name: Commit status
        run: |
          git config user.name "ARGUS Signals"
          git config user.email "signals@github.com"
          git add crypto/data/signals/current_status.json || true
          
          if git diff --staged --quiet; then
            echo "No changes in signal status"
            exit 0
          fi
          
          git commit -m "ARGUS: signal status updated [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              break
            fi
            sleep 5
          done