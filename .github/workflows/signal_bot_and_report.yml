name: ARGUS Signal Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Увеличил таймаут на случай первого скачивания пакетов

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check script exists
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ ! -f crypto/signals/signal_bot.py ]; then
            echo "::error::Файл crypto/signals/signal_bot.py не найден"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -H "Content-Type: application/json" -d '{"chat_id": "'"${TELEGRAM_CHAT_ID}"'", "text": "🚫 ARGUS Signal Engine: файл не найден\nЛог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "parse_mode": "HTML"}' || true
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'crypto/requirements.txt'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r crypto/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run Signal Bot
        env:
          AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
        run: python crypto/signals/signal_bot.py

      - name: Run Signal Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
        run: python crypto/report/signal_bot_report.py

      - name: Commit signals
        run: |
          git config user.name "ARGUS Signals"
          git config user.email "signals@github.com"
          git pull --rebase --autostash origin main || true
          git add crypto/data/signals/ || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "ARGUS: signal status updated [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin main

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -H "Content-Type: application/json" -d '{"chat_id": "'"${TELEGRAM_CHAT_ID}"'", "text": "⚠️ ARGUS Signal Engine упал\nЛог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "parse_mode": "HTML"}' || true