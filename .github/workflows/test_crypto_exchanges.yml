name: Test Crypto Exchanges

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests==2.32.3

      - name: Test exchanges
        run: |
          cd crypto/collect
          python exchanges.py