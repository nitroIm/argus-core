# ============================================================
# ARGUS - СКАЧИВАНИЕ ЛИЧНОЙ КНИГИ
# ------------------------------------------------------------
# Принимает URL и title через repository_dispatch.
# Скачивает PDF → коммитит в personal_books/.
# ============================================================

name: Personal Download

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL книги'
        required: true
      title:
        description: 'Название'
        required: false
        default: 'book'
  repository_dispatch:
    types: [personal_download]

permissions:
  contents: write

concurrency:
  group: argus-personal-download
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests==2.32.3

      - name: Run download
        env:
          BOOK_URL: ${{ github.event.client_payload.url || github.event.inputs.url }}
          BOOK_TITLE: ${{ github.event.client_payload.title || github.event.inputs.title }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/personal_download.py

      - name: Commit PDF
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add personal_books/ || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "ARGUS: personal book [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "Push OK"
              break
            fi
            echo "Retry $i"
            sleep 5
          done

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"Personal Download упал\", \"parse_mode\": \"HTML\"}" || true