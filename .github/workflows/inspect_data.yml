name: Inspect Parquet
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout argus-core
        uses: actions/checkout@v4

      - name: Checkout vision_out
        uses: actions/checkout@v4
        with:
          repository: nitroIm/vision_out
          path: vision_out
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas pyarrow

      - name: Run inspection
        run: python crypto/collect/inspect_data.py