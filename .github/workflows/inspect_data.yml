name: Inspect Parquet
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Диагностика — что реально лежит
        run: |
          echo "=== ROOT ==="
          ls -la
          echo ""
          echo "=== vision_out ==="
          ls -la vision_out/ 2>/dev/null || echo "нет папки vision_out"
          echo ""
          echo "=== vision_out/crypto/collect ==="
          ls -la vision_out/crypto/collect/ 2>/dev/null || echo "нет vision_out/crypto/collect"
          echo ""
          echo "=== поиск всех parquet ==="
          find . -name "*.parquet" -type f

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install
        run: pip install pandas pyarrow

      - name: Run
        run: python crypto/collect/inspect_data.py