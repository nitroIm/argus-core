# ============================================================
# ARGUS - ENRICH
# ------------------------------------------------------------
# v5b: ВРЕМЕННО + FEATURES_BOOTSTRAP='1' — одноразовый
#      пересчёт features_hourly на всю историю (LIMIT=9000).
#      После одного прогона убрать эту строку (см. v6).
# v4: + ARGUS_DB_URL_2, SYMBOLS, DB2_SYMBOLS.
# v3: общая очередь с detect (argus-crypto-pipeline).
# ============================================================

name: ARGUS Crypto Enrich

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: argus-crypto-pipeline
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: >-
            pip-crypto-${{ hashFiles('crypto/requirements.txt') }}
          restore-keys: pip-crypto-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r crypto/requirements.txt

      - name: Run enrich
        env:
          ARGUS_DB_URL: >-
            ${{ secrets.ARGUS_DB_URL }}
          ARGUS_DB_URL_2: >-
            ${{ secrets.ARGUS_DB_URL_2 }}
          SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
          DB2_SYMBOLS: SOLUSDT,BNBUSDT
          FEATURES_BOOTSTRAP: '1'
          TELEGRAM_BOT_TOKEN: >-
            ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: >-
            ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto/enrich/runner.py

      - name: Commit JSON
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add crypto/data/ || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "ARGUS: enrich data [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs \
              --autostash origin main || true
            if git push origin main; then
              echo "Push OK"
              break
            fi
            echo "Retry $i"
            sleep 5
          done

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: >-
            ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: >-
            ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \
                 \"text\": \"Enrich упал\", \
                 \"parse_mode\": \"HTML\"}" || true