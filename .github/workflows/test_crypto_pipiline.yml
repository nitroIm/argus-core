# ============================================================
# ARGUS-Trader — TEST PIPELINE
# ------------------------------------------------------------
# Временный тест. Проверяет, что pipeline.py собирает данные
# и пишет в Supabase. После успеха — УДАЛИТЬ.
# ------------------------------------------------------------
# v1: начальная версия
# ============================================================

name: Test Crypto Pipeline

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install requests==2.32.3 "psycopg[binary]==3.2.3"

      - name: Test pipeline (1 метрика)
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto/collect/pipeline.py --test

      - name: Run full pipeline
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto/collect/pipeline.py