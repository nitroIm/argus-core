name: ARGUS Weekly Trainer TEST

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check script exists
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ ! -f crypto/learn/weekly_trainer_test.py ]; then
            echo "::error::Файл crypto/learn/weekly_trainer_test.py не найден"
            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"🚫 ARGUS Weekly Trainer TEST: файл не найден — crypto/learn/weekly_trainer_test.py\\nЛог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"parse_mode\": \"HTML\"}" || true
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow fastparquet "psycopg[binary]"

      - name: Run Weekly Trainer TEST
        env:
          AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
        run: python crypto/learn/weekly_trainer_test.py

      - name: Save test results
        run: |
          git config user.name "ARGUS Trainer TEST"
          git config user.email "trainer@github.com"
          git add crypto/data/models/best_params_TEST.json || true
          if git diff --staged --quiet; then
            echo "No changes in test parameters"
            exit 0
          fi
          git commit -m "ARGUS: model retrained TEST [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              break
            fi
            sleep 5
          done

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"⚠️ ARGUS Weekly Trainer TEST упал\nЛог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"parse_mode\": \"HTML\"}" || true