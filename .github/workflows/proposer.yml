# ============================================================
# ARGUS — PROPOSER WORKFLOW v2 [PRODUCTION]
# ------------------------------------------------------------
# v2: продакшн-версия.
#   • Полные зависимости через requirements.txt (нужен torch)
#   • Cache HF models (модель перевода 300 МБ — не тянем каждый раз)
#   • Cache pip
#   • Retry на push
#   • Commit: proposals.json + pending_cards.json + sent_candidates.json
#     + translation_cache.json
# ------------------------------------------------------------
# v1: минимальный pip install requests
# ============================================================

name: ARGUS Proposer

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: argus-proposer
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-proposer-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: pip-proposer-

      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-argus-models-v1
          restore-keys: hf-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          for i in 1 2 3; do
            pip install --extra-index-url https://download.pytorch.org/whl/cpu \
                        -r scripts/requirements.txt && break
            echo "⚠️ pip попытка $i, жду 10с..."
            sleep 10
          done

      - name: Run proposer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/proposer.py

      - name: Commit and Push changes
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"

          git add data/proposals.json \
                  data/pending_cards.json \
                  data/sent_candidates.json \
                  data/translation_cache.json || true

          if git diff --staged --quiet; then
            echo "ℹ️ Нет изменений."
            exit 0
          fi

          git commit -m "ARGUS: new proposals [skip ci]"

          for i in 1 2 3; do
            git pull --rebase --autostash origin main && \
            git push origin main && {
              echo "✅ Предложения сохранены"
              break
            } || {
              echo "⚠️ Push попытка $i, жду 5с..."
              sleep 5
            }
          done