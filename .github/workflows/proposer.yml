name: ARGUS Proposer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run proposer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/proposer.py

      - name: Commit
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "ARGUS: proposals $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main || true
          git push || true