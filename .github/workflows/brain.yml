name: ARGUS Brain

on:
  schedule:
    - cron: "*/30 * * * *"   # каждые 30 минут
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: argus-brain
  cancel-in-progress: false

jobs:
  think:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests==2.32.3

      - name: Run brain
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/brain.py

      - name: Commit state
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add data/brain_state.json data/brain_decisions.json || true
          git diff --staged --quiet && echo "Нет изменений" && exit 0
          git commit -m "ARGUS: brain state [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            git push && break
            sleep 5
          done