name: ARGUS Brain (Master Scheduler)

on:
  workflow_dispatch:
  schedule:
    # Brain работает каждые 30 минут и проверяет, какие задачи нужно запустить
    # - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: argus-brain
  cancel-in-progress: false

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests==2.32.3

      - name: Run Brain Scheduler
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/brain.py

      - name: Commit state
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add data/brain_state.json data/brain_decisions.json || true
          
          if git diff --staged --quiet; then
            echo "Нет изменений"
            exit 0
          fi
          
          git commit -m "ARGUS: brain state [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "✅ Сохранено"
              break
            else
              sleep 5
            fi
          done
