name: ARGUS Brain

on:
  workflow_dispatch:
  schedule:
    # ИСПРАВЛЕНО: */30 * * * * означает "каждые 30 минут". 
    # (0 6 * * * означало бы "только в 6:00 утра каждый день")
   # - cron: "*/0 6 * * *"

permissions:
  contents: write

concurrency:
  group: argus-brain
  cancel-in-progress: false

jobs:
  think:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests==2.32.3

      - name: Run brain
        env:
          GITHUB_REPO: ${{ github.repository }}
          # ОСТАВЛЯЕМ GH_PAT, так как ключ лежит именно под этим именем в Secrets
          GITHUB_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/brain.py

      - name: Commit and Push state
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          
          git add data/brain_state.json data/brain_decisions.json || true
          
          if git diff --staged --quiet; then
            echo "Нет изменений в состоянии мозга."
            exit 0
          fi
          
          echo "Есть изменения. Коммичу и пушу..."
          git commit -m "ARGUS: brain state update [skip ci]"
          
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "✅ Состояние мозга успешно сохранено"
              break
            else
              echo "⚠️ Попытка $i не удалась, жду 5 секунд..."
              sleep 5
            fi
          done
