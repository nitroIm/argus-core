name: Check Token

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List repos
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "=== Все репозитории токена ==="
          curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/user/repos?per_page=100" | grep '"full_name"'