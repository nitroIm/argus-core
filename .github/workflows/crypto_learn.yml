# ============================================================
# ARGUS - LEARN (ML training)
# ------------------------------------------------------------
# v10: Meta-labeling + Triple Barrier + Regime + RFE.
#      Only Run learn (all-in-one train.py v19).
#      Removed regression steps (xgb/cat/ridge/mlp/lstm).
#      Removed train_weights (meta-labeling replaces).
# ============================================================

name: Crypto Learn

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: argus-crypto-learn
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: >-
            pip-learn-${{ hashFiles('crypto/requirements.txt') }}
          restore-keys: pip-learn-

      - name: Install deps
        run: |
          pip install -r crypto/requirements.txt

      - name: Run learn
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          ARGUS_DB_URL_2: ${{ secrets.ARGUS_DB_URL_2 }}
          SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
          DB2_SYMBOLS: SOLUSDT,BNBUSDT
          HORIZON: '12'
          TB_UP_MULT: '1.0'
          TB_DN_MULT: '1.0'
          TB_VOL_WINDOW: '24'
        run: python crypto/learn/runner.py

      - name: Export for migration
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
        run: python crypto/learn/export.py

      - name: Commit artifacts
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add crypto/learn/models/ || true
          git add crypto/learn/export/ || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "ARGUS: learn update [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs \
              --autostash origin main || true
            if git push origin main; then
              echo "Push OK"
              break
            fi
            echo "Retry $i"
            sleep 5
          done