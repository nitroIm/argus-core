# ============================================================
# ARGUS - LEARN (ML training)
# ------------------------------------------------------------
# v8: + Run lstm.
# v7: + Run ridge + Run mlp.
# v6: + Run weights.
# v5: + Run cat.
# v4: + Run xgb.
# ============================================================

name: Crypto Learn

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: argus-crypto-learn
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install torch (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: >-
            pip-learn-${{ hashFiles('crypto/requirements.txt') }}
          restore-keys: pip-learn-

      - name: Install deps
        run: |
          pip install -r crypto/requirements.txt

      - name: Run learn
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          ARGUS_DB_URL_2: ${{ secrets.ARGUS_DB_URL_2 }}
          SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
          DB2_SYMBOLS: SOLUSDT,BNBUSDT
          HORIZON: '12'
          MOVE_THRESHOLD_PCT: '0.5'
          TELEGRAM_BOT_TOKEN: >-
            ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: >-
            ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto/learn/runner.py

      - name: Run xgb
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          ARGUS_DB_URL_2: ${{ secrets.ARGUS_DB_URL_2 }}
          SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
          DB2_SYMBOLS: SOLUSDT,BNBUSDT
          HORIZON: '12'
        run: python crypto/learn/train_xgb.py

      - name: Run cat
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          ARGUS_DB_URL_2: ${{ secrets.ARGUS_DB_URL_2 }}
          SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
          DB2_SYMBOLS: SOLUSDT,BNBUSDT
          HORIZON: '12'
        run: python crypto/learn/train_cat.py

      - name: Run ridge
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          ARGUS_DB_URL_2: ${{ secrets.ARGUS_DB_URL_2 }}
          SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
          DB2_SYMBOLS: SOLUSDT,BNBUSDT
          HORIZON: '12'
        run: python crypto/learn/train_ridge.py

      - name: Run mlp
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          ARGUS_DB_URL_2: ${{ secrets.ARGUS_DB_URL_2 }}
          SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
          DB2_SYMBOLS: SOLUSDT,BNBUSDT
          HORIZON: '12'
        run: python crypto/learn/train_mlp.py

      - name: Run lstm
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          ARGUS_DB_URL_2: ${{ secrets.ARGUS_DB_URL_2 }}
          SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
          DB2_SYMBOLS: SOLUSDT,BNBUSDT
          HORIZON: '12'
        run: python crypto/learn/train_lstm.py

      - name: Run weights
        env:
          SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
        run: python crypto/learn/train_weights.py

      - name: Export for migration
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
        run: python crypto/learn/export.py

      - name: Commit artifacts
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add crypto/learn/models/ || true
          git add crypto/learn/export/ || true
          git add crypto/learn/last_predictions.json || true
          git add crypto/learn/last_signals.json || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "ARGUS: learn update [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs \
              --autostash origin main || true
            if git push origin main; then
              echo "Push OK"
              break
            fi
            echo "Retry $i"
            sleep 5
          done

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: >-
            ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: >-
            ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \
                 \"text\": \"Crypto Learn failed\"}" || true