# ============================================================
# ARGUS - АУДИОКНИГА ИЗ PDF
# ------------------------------------------------------------
# Читает PDF из personal_books/, делает mp3, отправляет в TG.
# mp3 в /tmp (удаляется после отправки).
# PDF остаётся в репо.
# ============================================================

name: Personal Audio

on:
  workflow_dispatch:
    inputs:
      book:
        description: 'Имя книги (без .pdf)'
        required: true
      prefer:
        description: 'ru или en'
        required: false
        default: 'ru'
  repository_dispatch:
    types: [run_audio]

permissions:
  contents: read

concurrency:
  group: argus-personal-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install gTTS==2.5.1
          pip install PyPDF2==3.0.1
          pip install requests==2.32.3

      - name: Check ffmpeg
        run: ffmpeg -version | head -1

      - name: Run audio
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOOK: ${{ github.event.client_payload.book || github.event.inputs.book }}
          PREFER: ${{ github.event.client_payload.prefer || github.event.inputs.prefer }}
        run: |
          if [ -z "$BOOK" ]; then
            echo "BOOK not set"
            exit 1
          fi
          python scripts/personal_audio.py "$BOOK" --$PREFER

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"Audio упал\", \"parse_mode\": \"HTML\"}" || true