name: Intel Tuner Worker

on:
  workflow_dispatch: 

concurrency:
  group: intel-tuner-group
  cancel-in-progress: false 

permissions:
  contents: write

jobs:
  run-tuner:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Указываем, что все команды выполняются внутри папки crypto
    defaults:
      run:
        working-directory: ./crypto

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'crypto/requirements.txt' # Указываем точный путь к кэшу

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Intel Tuner
        env:
          AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
        run: |
          python intel/intel_tuner.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Intel Tuner Bot"
          
          # Проверяем изменения в конфиге
          if [[ -n "$(git status --porcelain data/intel/bot_config.json)" ]]; then
            git add data/intel/bot_config.json
            git commit -m "Auto-update: bot_config.json [skip ci]"
            
            # Возвращаемся в корень репозитория для пуша
            cd ..
            git pull --rebase origin main
            git push
          else
            echo "Конфиг не изменился. Пуш не требуется."
          fi