name: Intel Tuner Worker

on:
  workflow_dispatch: 

concurrency:
  group: intel-tuner-group
  cancel-in-progress: false 

permissions:
  contents: write

jobs:
  run-tuner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./crypto

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'crypto/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run Intel Tuner
        env:
          AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
        run: |
          python intel/intel_tuner.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Intel Tuner Bot"
          
          # ФИКС: Добавлен bot_info.json и data/signals/
          if [[ -n "$(git status --porcelain data/intel/bot_config.json)" ]] || [[ -n "$(git status --porcelain data/models/)" ]] || [[ -n "$(git status --porcelain data/signals/bot_info.json)" ]]; then
            git add data/intel/bot_config.json data/models/ data/signals/bot_info.json
            git commit -m "Auto-update: tuner state & config [skip ci]"
            
            cd ..
            git pull --rebase origin main
            git push
          else
            echo "Изменений нет. Пуш не требуется."
          fi