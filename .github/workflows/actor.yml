name: ARGUS Actor

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 5 * * *"   # Раскомментируй, когда будешь готов к ежедневной автономной работе (5:00 UTC)

permissions:
  contents: write

concurrency:
  group: argus-actor
  cancel-in-progress: false

jobs:
  act:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v3

      - name: Install CPU torch
        run: |
          pip install torch==2.2.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install sentence-transformers==3.0.1
          pip install faiss-cpu==1.8.0
          pip install transformers==4.41.2
          pip install requests==2.32.3
          pip install numpy==1.26.4
          pip install urllib3==2.2.2

      - name: Run actor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # КРИТИЧЕСКИ ВАЖНО: actor.py нужен PAT для запуска других workflow (например, explorer)
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          GITHUB_REPO: ${{ github.repository }}
        run: python scripts/actor.py

      - name: Commit and Push changes
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          
          # Добавляем только измененные файлы в data/
          git add data/ || true
          
          # Проверяем, есть ли что коммитить
          if git diff --staged --quiet; then
            echo "Нет изменений для коммита."
            exit 0
          fi
          
          echo "Есть изменения. Коммичу и пушу..."
          git commit -m "ARGUS: выполнил действия [skip ci]"
          
          # Надежный пуш с обработкой конфликтов (race conditions)
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "✅ Успешно отправлено в репозиторий"
              break
            else
              echo "⚠️ Попытка $i не удалась, жду 5 секунд..."
              sleep 5
            fi
          done
