name: ARGUS Actor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"   # каждый день в 5:00 UTC

permissions:
  contents: write

concurrency:
  group: argus-actor
  cancel-in-progress: false

jobs:
  act:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v3

      - name: Install CPU torch
        run: |
          pip install torch==2.2.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install sentence-transformers==3.0.1
          pip install faiss-cpu==1.8.0
          pip install transformers==4.41.2
          pip install requests==2.32.3
          pip install numpy==1.26.4

      - name: Run actor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/actor.py

      - name: Commit
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add data/ || true
          git diff --staged --quiet && echo "Нет изменений" && exit 0
          git commit -m "ARGUS: выполнил действия [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            git push && break
            sleep 5
          done