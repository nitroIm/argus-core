name: ARGUS Benchmark

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run_benchmark]
  # schedule:
  #   - cron: '0 5 * * 0'  # Каждое воскресенье в 5:00 UTC

permissions:
  contents: write

concurrency:
  group: argus-benchmark
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-bench-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: pip-bench-

      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-e5-small-v1
          restore-keys: hf-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
                      -r scripts/requirements.txt

      - name: Run benchmark
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/benchmark.py

      - name: Commit and Push results
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"

          # Безопасно коммитим только файлы результатов бенчмарка
          git add data/benchmark_results.json data/benchmark_history.json || true

          if git diff --staged --quiet; then
            echo "Нет изменений в результатах бенчмарка."
            exit 0
          fi

          echo "Есть изменения. Коммичу и пушу..."
          git commit -m "ARGUS: benchmark results [skip ci]"

          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "✅ Результаты успешно отправлены в репозиторий"
              break
            else
              echo "⚠️ Попытка $i не удалась, жду 5 секунд..."
              sleep 5
            fi
          done