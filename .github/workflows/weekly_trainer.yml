name: Weekly trainer

on:
  workflow_dispatch: 
  # schedule:
  #   - cron: '0 21 * * 0'

permissions:
  contents: write

concurrency:
  group: argus-train-model
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check script exists
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ ! -f crypto/learn/weekly_trainer.py ]; then
            echo "::error::Файл crypto/learn/weekly_trainer.py не найден"
            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"🚫 ARGUS Weekly Trainer: файл не найден — crypto/learn/weekly_trainer.py\\nЛог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"parse_mode\": \"HTML\"}" || true
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow fastparquet "psycopg[binary]" xgboost scikit-learn scipy

      - name: Run Trainer
        env:
          AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto/learn/weekly_trainer.py

      - name: Commit best params
        run: |
          git config user.name "ARGUS Trainer"
          git config user.email "trainer@github.com"
          git add crypto/data/models/best_params.json || true
          if git diff --staged --quiet; then
            echo "No changes in parameters"
            exit 0
          fi
          git commit -m "ARGUS: model retrained [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              break
            fi
            sleep 5
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: training-results
          path: crypto/data/models/best_params.json

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"⚠️ ARGUS Weekly Trainer упал\nЛог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"parse_mode\": \"HTML\"}" || true