name: ARGUS Weekly Trainer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check script exists
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ ! -f crypto/learn/weekly_trainer.py ]; then
            echo "::error::Файл crypto/learn/weekly_trainer.py не найден"
            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"🚫 ARGUS Weekly Trainer: файл не найден\\nЛог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"parse_mode\": \"HTML\"}" || true
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # ← ДОБАВЛЕНО: кэш pip по requirements/hash

      # ↑ выше cache: 'pip' кэширует по хэшу файлов зависимостей,
      # но у нас нет requirements.txt, поэтому дальше делаем явный кэш
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/train.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow fastparquet "psycopg[binary]" xgboost scikit-learn scipy requests lightgbm catboost torch

      - name: Run Weekly Trainer
        env:
          AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto/learn/weekly_trainer.py

      - name: Commit trained models
        run: |
          git config user.name "ARGUS Trainer"
          git config user.email "trainer@github.com"
          mkdir -p /tmp/models_backup
          cp crypto/data/models/* /tmp/models_backup/ 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/models_backup/* crypto/data/models/ 2>/dev/null || true
          git add crypto/data/models/
          if git diff --staged --quiet; then
            echo "No changes in models"
            exit 0
          fi
          git commit -m "ARGUS: models retrained [skip ci]"
          git push origin main

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: training-results
          path: crypto/data/models/