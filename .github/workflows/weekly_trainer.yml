name: Weekly trainer

on:
  workflow_dispatch: 
  # schedule:
  #   - cron: '0 21 * * 0' # На случай, если решишь использовать встроенный крон GitHub

permissions:
  contents: write

concurrency:
  group: argus-train-model
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow fastparquet "psycopg[binary]"

      - name: Run Trainer
        env:
          AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
        run: python crypto/learn/weekly_trainer.py

      - name: Commit best params
        run: |
          git config user.name "ARGUS Trainer"
          git config user.email "trainer@github.com"
          git add crypto/data/models/best_params.json || true
          if git diff --staged --quiet; then
            echo "No changes in parameters"
            exit 0
          fi
          git commit -m "ARGUS: model retrained [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              break
            fi
            sleep 5
          done
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: training-results
          path: crypto/data/models/best_params.json