name: ARGUS Weekly Trainer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check script exists
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ ! -f crypto/learn/weekly_trainer.py ]; then
            echo "::error::Файл crypto/learn/weekly_trainer.py не найден"
            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"🚫 ARGUS Weekly Trainer: файл не найден — crypto/learn/weekly_trainer.py\\nЛог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"parse_mode\": \"HTML\"}" || true
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow fastparquet "psycopg[binary]" xgboost scikit-learn scipy requests lightgbm catboost

      - name: Run Weekly Trainer
        env:
          AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto/learn/weekly_trainer.py

      - name: Commit trained models
        run: |
          git config user.name "ARGUS Trainer"
          git config user.email "trainer@github.com"
          
          # Жестко сохраняем обученный файл, чтобы бот его не перезаписал
          cp crypto/data/models/best_params.json /tmp/best_params.json
          
          git fetch origin main
          git reset --hard origin/main
          
          # Возвращаем обученный файл обратно
          cp /tmp/best_params.json crypto/data/models/best_params.json
          
          git add crypto/data/models/best_params.json
          if git diff --staged --quiet; then
            echo "No changes in parameters"
            exit 0
          fi
          git commit -m "ARGUS: model retrained [skip ci]"
          git push origin main

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: training-results
          path: crypto/data/models/best_params.json