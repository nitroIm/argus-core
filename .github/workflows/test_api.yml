name: ARGUS Test APIs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Test APIs
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python crypto/collect/test_api.py