name: Test Global DB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install psycopg
        run: pip install "psycopg[binary]==3.2.3"

      - name: Test connection
        env:
          ARGUS_DB_URL_2: >-
            ${{ secrets.ARGUS_DB_URL_2 }}
        run: python scripts/test_global_db.py