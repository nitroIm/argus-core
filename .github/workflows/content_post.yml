name: ARGUS Content Post

on:
  workflow_dispatch:
  repository_dispatch:
    types: [post_publish, post_skip, post_generate]

permissions:
  contents: write

concurrency:
  group: argus-content
  cancel-in-progress: false

jobs:
  generate:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'post_generate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests==2.32.3

      - name: Generate draft
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/content_generator.py

      - name: Commit draft
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          
          # Безопасно коммитим только файл черновика
          git add data/pending_post.json || true
          
          if git diff --staged --quiet; then
            echo "Нет изменений для коммита."
            exit 0
          fi
          
          git commit -m "ARGUS: new draft generated [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "✅ Черновик сохранен"
              break
            else
              sleep 5
            fi
          done

  publish:
    if: |
      github.event.action == 'post_publish' ||
      github.event.action == 'post_skip'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests==2.32.3

      - name: Publish or skip
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.action }}" = "post_skip" ]; then
            python scripts/publish_post.py skip
          else
            python scripts/publish_post.py go
          fi

      - name: Commit status
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          
          git add data/pending_post.json || true
          
          if git diff --staged --quiet; then
            echo "Нет изменений статуса для коммита."
            exit 0
          fi
          
          git commit -m "ARGUS: post handled [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "✅ Статус поста сохранен"
              break
            else
              sleep 5
            fi
          done
