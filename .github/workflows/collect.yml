name: ARGUS Collect Data

on:
  schedule:
    - cron: "0 * * * *"   # каждый час
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run collect
        run: python scripts/collect_data.py

      - name: Commit data
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add data/price_history.json
          git diff --staged --quiet || git commit -m "ARGUS: новые свечи BTC"
          git push