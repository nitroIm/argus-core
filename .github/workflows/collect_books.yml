name: ARGUS Collect Books

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL для сбора'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests==2.32.3

      - name: Run collector
        run: |
          cd scripts
          if [ -z "${{ github.event.inputs.url }}" ]; then
            python collector.py
          else
            python collector.py "${{ github.event.inputs.url }}"
          fi

      - name: Debug — что скачалось
        run: |
          echo "=== Корень репо ==="
          ls -la books/ || echo "books/ пусто"
          echo "=== scripts/books ==="
          ls -la scripts/books/ 2>/dev/null || echo "scripts/books нет"

      - name: Commit books
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add books/ scripts/books/ 2>/dev/null || true
          git status
          git diff --staged --quiet && echo "❌ Нечего коммитить" && exit 0
          git commit -m "ARGUS: новые книги [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            git push && break
            sleep 5
          done