name: ARGUS Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run audit
        run: python scripts/audit.py

      - name: Commit report
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add data/audit_report.json
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "ARGUS: audit report [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then break; fi
            sleep 5
          done