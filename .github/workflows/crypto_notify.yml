# ============================================================
# ARGUS - Notify (hourly signals)
# ------------------------------------------------------------
# Читает модель, делает predict, шлёт BUY/SELL в TG.
# Cron-job.org: 45 * * * *
# ============================================================

name: Crypto Notify

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: argus-crypto-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-learn-${{ hashFiles('crypto/requirements.txt') }}
          restore-keys: pip-learn-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r crypto/requirements.txt

      - name: Predict
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
        run: python crypto/learn/predict.py

      - name: Signals
        run: python crypto/learn/signals.py

      - name: Notify
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto/learn/notify.py

      - name: Commit signals
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add crypto/learn/last_predictions.json || true
          git add crypto/learn/last_signals.json || true
          git add crypto/learn/notify_state.json || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "notify: signals [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs \
              --autostash origin main || true
            if git push origin main; then
              break
            fi
            sleep 5
          done