name: ARGUS Explorer

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Тема для поиска (опционально)'
        required: false
        default: ''
  repository_dispatch:
    types: [explore_topic]

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run explorer
        env:
          EXPLORE_TOPIC: ${{ github.event.client_payload.topic || github.event.inputs.topic }}
        run: python scripts/explorer.py

      - name: Commit
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "ARGUS: explorer $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main || true
          git push || true