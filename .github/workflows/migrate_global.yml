name: Migrate Global Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install psycopg
        run: pip install "psycopg[binary]==3.2.3"

      - name: Migrate
        env:
          ARGUS_DB_URL: >-
            ${{ secrets.ARGUS_DB_URL }}
          ARGUS_DB_URL_2: >-
            ${{ secrets.ARGUS_DB_URL_2 }}
        run: python scripts/migrate_global.py