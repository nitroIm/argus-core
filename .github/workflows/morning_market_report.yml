# ============================================================
# ARGUS - УТРЕННИЙ ОТЧЁТ РЫНКА
# ------------------------------------------------------------
# Только BTC. Только Aiven DB. Текстовый отчёт в Telegram.
# Cron закомментирован — запуск из других источников.
# ============================================================

name: ARGUS Morning Report

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run_morning]
  # schedule:
  #  - cron: '0 7 * * *'

permissions:
  contents: read

concurrency:
  group: argus-morning-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg[binary]" requests

      - name: Morning report
        env:
          AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto/report/morning_report.py

      - name: Notify on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"⚠️ Утренний отчёт упал\", \"parse_mode\": \"HTML\"}" || true