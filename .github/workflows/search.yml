name: ARGUS Search

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Поисковый запрос'
        required: true
        default: 'Что такое имбаланс?'
  repository_dispatch:
    types: [run_search]

permissions:
  contents: read

concurrency:
  group: argus-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v3
          restore-keys: hf-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.0"
          pip install sentence-transformers==3.0.1 faiss-cpu==1.8.0 requests==2.32.3

      - name: Extract query and chat_id
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "query=${{ github.event.client_payload.query }}" >> $GITHUB_OUTPUT
            echo "chat_id=${{ github.event.client_payload.chat_id }}" >> $GITHUB_OUTPUT
          else
            echo "query=${{ github.event.inputs.query }}" >> $GITHUB_OUTPUT
            echo "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" >> $GITHUB_OUTPUT
          fi

      - name: Run semantic search
        env:
          QUERY: ${{ steps.vars.outputs.query }}
          SEARCH_RESULT_FILE: /tmp/search_result.json
        run: |
          echo "Searching for: $QUERY"
          python scripts/search.py "$QUERY" --top 5
          echo "--- result file ---"
          cat /tmp/search_result.json

      - name: Send result to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ steps.vars.outputs.chat_id }}
          SEARCH_RESULT_FILE: /tmp/search_result.json
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os
          import json
          import requests

          bot_token = os.environ['BOT_TOKEN']
          chat_id = os.environ['CHAT_ID']
          result_path = os.environ['SEARCH_RESULT_FILE']

          try:
              with open(result_path, encoding='utf-8') as f:
                  result = json.load(f)
          except Exception as e:
              requests.post(
                  f"https://api.telegram.org/bot{bot_token}/sendMessage",
                  json={
                      'chat_id': chat_id,
                      'text': f"❌ Ошибка чтения результата: {e}",
                      'parse_mode': 'HTML',
                  },
                  timeout=15,
              )
              raise SystemExit(0)

          if 'error' in result:
              text = f"❌ <b>Ошибка поиска:</b>\n<code>{result['error']}</code>"
          elif not result.get('results'):
              text = f"🔎 <b>Запрос:</b> <i>{result.get('query')}</i>\n\nНичего не найдено."
          else:
              text = f"🔎 <b>Результаты для:</b> <i>{result.get('query')}</i>\n\n"
              for i, r in enumerate(result['results'], 1):
                  score = r.get('score', 0)
                  book = r.get('book', r.get('source', 'Неизвестно'))
                  chunk_text = r.get('text', '')
                  if len(chunk_text) > 400:
                      chunk_text = chunk_text[:397] + "..."
                  safe_text = chunk_text.replace("<", "&lt;").replace(">", "&gt;")
                  text += f"{i}. <b>Книга:</b> <code>{book}</code> (score {score:.2f})\n"
                  text += f"<blockquote>{safe_text}</blockquote>\n\n"

          url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          payload = {
              'chat_id': chat_id,
              'text': text,
              'parse_mode': 'HTML',
              'disable_web_page_preview': True,
          }

          response = requests.post(url, json=payload, timeout=15)
          print(f"TG status: {response.status_code}")
          PYTHON_SCRIPT