name: Test Levels

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r crypto/requirements.txt

      - name: Test levels
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
        run: python crypto/enrich/levels.py