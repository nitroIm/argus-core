# ============================================================
# ARGUS - NEWS REPORT
# ------------------------------------------------------------
# Отправка отчёта по новостям.
#   TG личка:        09:00 + 20:00 КЛГ
#   TG канал/группа: 09:00 КЛГ
#   VK группа:       09:00 КЛГ
#
# ТЕСТ: раскомментируй NEWS_TEST_MODE: "1" ниже.
# ============================================================

name: ARGUS News Report

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: argus-news-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests "psycopg[binary]"

      - name: Report news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
          # NEWS_TEST_MODE: "1"
        run: python crypto/report/news_report.py

      - name: Commit
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add crypto/data/news_sent_history.json || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "ARGUS: news sent history [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              break
            fi
            sleep 5
          done

      # ==========================================
      # УНИВЕРСАЛЬНАЯ ЗАЩИТА ОТ ПАДЕНИЙ
      # ==========================================
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"⚠️ <b>Сбой в: ${{ github.workflow }}</b>\nПроверь логи в GitHub Actions!\", \"parse_mode\": \"HTML\"}" || true