name: ARGUS Train Model

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run_train]

permissions:
  contents: write

concurrency:
  group: argus-train-pipeline
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    outputs:
      skip: ${{ steps.check.outputs.skip }}
      books: ${{ steps.summary.outputs.books }}
      chunks: ${{ steps.summary.outputs.chunks }}
      new_chunks: ${{ steps.summary.outputs.new_chunks }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-train-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: pip-train-

      - name: Cache HuggingFace
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-e5-base-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
                      -r scripts/requirements.txt

      # ============================================================
      # ШАГ 1: ПРОВЕРКА НОВЫХ КНИГ
      # ============================================================
      - name: Check for new books
        id: check
        run: |
          mkdir -p data
          if [ ! -d books ] || [ -z "$(ls -A books 2>/dev/null)" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "📭 books/ пуст — пропуск"
            exit 0
          fi

          CURRENT=$(find books -type f \( -name '*.pdf' -o -name '*.txt' -o -name '*.md' \) \
                    -exec md5sum {} + 2>/dev/null | sort | md5sum | cut -d' ' -f1)
          LAST=$(cat data/last_train_fingerprint.txt 2>/dev/null || echo "none")

          if [ "$CURRENT" = "$LAST" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ Новых книг нет"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "📚 Есть новые книги"
            echo "$CURRENT" > /tmp/new_fingerprint.txt
          fi

      # ============================================================
      # ШАГ 2: INGEST (merge, не перезапись)
      # ============================================================
      - name: Ingest books
        if: steps.check.outputs.skip == 'false'
        run: python scripts/ingest.py

      # ============================================================
      # ШАГ 3: TRAIN (только новые чанки, frozen E5)
      # ============================================================
      - name: Train embeddings (incremental)
        if: steps.check.outputs.skip == 'false'
        run: python scripts/train_embeddings.py

      # ============================================================
      # ШАГ 4: BUILD/APPEND INDEX
      # ============================================================
      - name: Build index (append)
        if: steps.check.outputs.skip == 'false'
        run: python scripts/build_index.py

      # ============================================================
      # ШАГ 5: SUMMARY
      # ============================================================
      - name: Compute summary
        id: summary
        if: steps.check.outputs.skip == 'false'
        run: |
          if [ -f data/summary.json ]; then
            BOOKS=$(python -c "import json;d=json.load(open('data/summary.json'));print(d.get('total_books',0))" 2>/dev/null || echo 0)
            CHUNKS=$(python -c "import json;d=json.load(open('data/summary.json'));print(d.get('total_chunks',0))" 2>/dev/null || echo 0)
            NEW=$(python -c "import json;d=json.load(open('data/summary.json'));print(d.get('new_chunks',0))" 2>/dev/null || echo 0)
            echo "books=${BOOKS}" >> $GITHUB_OUTPUT
            echo "chunks=${CHUNKS}" >> $GITHUB_OUTPUT
            echo "new_chunks=${NEW}" >> $GITHUB_OUTPUT
          else
            echo "books=0" >> $GITHUB_OUTPUT
            echo "chunks=0" >> $GITHUB_OUTPUT
            echo "new_chunks=0" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # ШАГ 6: FINGERPRINT
      # ============================================================
      - name: Save fingerprint
        if: steps.check.outputs.skip == 'false'
        run: cp /tmp/new_fingerprint.txt data/last_train_fingerprint.txt

      # ============================================================
      # ШАГ 7: УДАЛЕНИЕ PDF, КОТОРЫЕ УСПЕШНО ПОПАЛИ В БАЗУ
      # ============================================================
      - name: Cleanup ingested PDFs
        if: steps.check.outputs.skip == 'false'
        run: |
          python3 << 'PYEOF'
          import json, os, sys

          if not os.path.exists("data/faiss.index") or os.path.getsize("data/faiss.index") == 0:
              print("⚠️ faiss.index пуст — cleanup отменён")
              sys.exit(0)

          if not os.path.exists("data/last_ingest.json"):
              print("⚠️ last_ingest.json нет — cleanup отменён")
              sys.exit(0)

          with open("data/last_ingest.json", encoding="utf-8") as f:
              last = json.load(f)

          files = last.get("files", [])
          if not files:
              print("ℹ️ Нечего удалять")
              sys.exit(0)

          deleted = 0
          for fname in files:
              path = os.path.join("books", fname)
              if os.path.isfile(path):
                  try:
                      os.remove(path)
                      deleted += 1
                      print(f"🗑️ Удалено: {fname}")
                  except Exception as e:
                      print(f"⚠️ Не удалось удалить {fname}: {e}")

          print(f"CLEANUP DONE: удалено {deleted} из {len(files)}")
          PYEOF

      # ============================================================
      # ШАГ 8: COMMIT & PUSH
      # ============================================================
      - name: Commit and Push
        if: steps.check.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"

          git add data/knowledge.json \
                  data/chunks_metadata.json \
                  data/faiss.index \
                  data/summary.json \
                  data/last_ingest.json \
                  data/model_info.json \
                  data/last_train_fingerprint.txt \
                  books/ || true

          if git diff --staged --quiet; then
            echo "ℹ️ Нет изменений"
            exit 0
          fi

          git commit -m "ARGUS: incremental train [skip ci]"

          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && {
              echo "✅ Push успешен"; break;
            } || {
              echo "⚠️ Попытка $i неудачна, жду 5с"; sleep 5;
            }
          done

  notify:
    needs: train
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify result
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SKIP_FLAG: ${{ needs.train.outputs.skip }}
          BOOKS: ${{ needs.train.outputs.books }}
          CHUNKS: ${{ needs.train.outputs.chunks }}
          NEW_CHUNKS: ${{ needs.train.outputs.new_chunks }}
          TRAIN_RESULT: ${{ needs.train.result }}
        run: |
          if [ "${SKIP_FLAG}" = "true" ]; then
            TEXT="⏸️ Train пропущен (новых книг нет)"
          elif [ "${TRAIN_RESULT}" = "success" ]; then
            TEXT="🎓 Train OK\n📚 Книг: ${BOOKS}\n🧩 Чанков: ${CHUNKS}\n✨ Новых: ${NEW_CHUNKS}"
          else
            TEXT="❌ Train упал — смотри логи Actions"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"${TEXT}\", \"parse_mode\": \"HTML\"}" || true