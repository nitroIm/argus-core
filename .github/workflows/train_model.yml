name: ARGUS Train Model

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run_train]
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.fingerprint.outputs.skip }}
      changed: ${{ steps.fingerprint.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for changes
        id: fingerprint
        run: |
          mkdir -p data
          if [ ! -d books ] || [ -z "$(ls -A books 2>/dev/null)" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "📭 Нет книг в books/"
            exit 0
          fi
          
          # Стабильный fingerprint: хэшируем содержимое файлов
          CURRENT=$(find books/ -type f -exec md5sum {} + | sort | md5sum | cut -d' ' -f1)
          LAST=$(cat data/last_train_fingerprint.txt 2>/dev/null || echo "none")
          
          echo "current=$CURRENT"
          echo "last=$LAST"
          
          if [ "$CURRENT" = "$LAST" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ Новых книг нет — Train пропущен."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📚 Есть новые книги — запускаю Train."
            echo "$CURRENT" > /tmp/new_fingerprint.txt
          fi

  train:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-train-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: pip-train-

      - name: Cache HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('scripts/train_embeddings.py') }}
          restore-keys: hf-models-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.2.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements.txt

      - name: Ingest books
        run: python scripts/ingest.py

      - name: Train embeddings
        run: |
          python scripts/train_embeddings.py \
            --data-path data/knowledge.json \
            --output-dir models/argus-embeddings \
            --epochs 3 \
            --batch-size 32

      - name: Build index
        run: python scripts/build_index.py

      - name: Save fingerprint
        run: cp /tmp/new_fingerprint.txt data/last_train_fingerprint.txt

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argus-embeddings
          path: models/argus-embeddings/
          retention-days: 30

      - name: Commit data changes
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          
          # Коммитим только data/, не модели
          git add data/
          git diff --staged --quiet || git commit -m "ARGUS: update chunks $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          
          git pull --rebase origin main || true
          git push || true

  notify:
    needs: [check, train]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify result
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ needs.check.outputs.skip }}" = "true" ]; then
            TEXT="⏭️ <b>Train пропущен</b>%0AНет изменений в книгах."
          elif [ "${{ needs.train.result }}" = "success" ]; then
            TEXT="🎓 <b>Train завершён</b>%0AЭмбеддинги и индекс обновлены."
          else
            TEXT="❌ <b>Train упал</b>%0AПроверь Actions."
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${TEXT}" \
            -d "parse_mode=HTML"
