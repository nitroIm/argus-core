name: ARGUS Train Model

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run_train]

permissions:
  contents: write

concurrency:
  group: argus-train-pipeline
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    outputs:
      skip: ${{ steps.check.outputs.skip }}
      books: ${{ steps.summary.outputs.books }}
      chunks: ${{ steps.summary.outputs.chunks }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-train-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: pip-train-

      - name: Cache HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5
          restore-keys: hf-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.2.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements.txt

      - name: Check for new books
        id: check
        run: |
          mkdir -p data
          if [ ! -d books ] || [ -z "$(ls -A books 2>/dev/null)" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          CURRENT=$(find books -type f -exec md5sum {} + 2>/dev/null | sort | md5sum | cut -d' ' -f1)
          LAST=$(cat data/last_train_fingerprint.txt 2>/dev/null || echo "none")
          if [ "$CURRENT" = "$LAST" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ Новых книг нет"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "📚 Запуск обучения"
            echo "$CURRENT" > /tmp/new_fingerprint.txt
          fi

      - name: Archive old knowledge to tmp
        if: steps.check.outputs.skip == 'false'
        run: cp data/knowledge.json /tmp/knowledge_old.json 2>/dev/null || true

      - name: Ingest books
        if: steps.check.outputs.skip == 'false'
        run: python scripts/ingest.py

      - name: Merge old and new knowledge
        if: steps.check.outputs.skip == 'false'
        run: |
          python3 << 'PYEOF'
          import json, os
          def load(p):
              if os.path.exists(p):
                  try:
                      with open(p, encoding="utf-8") as f:
                          return json.load(f)
                  except Exception:
                      pass
              return {"books": [], "chunks": []}
          old = load("/tmp/knowledge_old.json")
          new = load("data/knowledge.json")
          known = {str(b.get("file")) for b in old.get("books", []) if b.get("file")}
          books = list(old.get("books", []))
          for b in new.get("books", []):
              if b.get("file") and str(b["file"]) not in known:
                  books.append(b)
          def bok(c):
              if not isinstance(c, dict):
                  return None
              for k in ("book", "source", "file"):
                  v = c.get(k)
                  if v:
                      return str(v)
              return None
          chunks = list(old.get("chunks", []))
          added = 0
          for c in new.get("chunks", []):
              b = bok(c)
              if b is None or b not in known:
                  chunks.append(c)
                  added += 1
          out = dict(new)
          out["books"] = books
          out["chunks"] = chunks
          with open("data/knowledge.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False)
          print(f"MERGE OK: книг {len(books)}, чанков +{added} = {len(chunks)}")
          PYEOF

      - name: Clean old index
        if: steps.check.outputs.skip == 'false'
        run: |
          rm -f data/faiss.index
          rm -f data/chunks_metadata.json
          echo "✅ Старая картотека удалена"

      - name: Train Embeddings
        if: steps.check.outputs.skip == 'false'
        run: python scripts/train_embeddings.py

      - name: Build index
        if: steps.check.outputs.skip == 'false'
        run: python scripts/build_index.py

      - name: Normalize metadata format
        if: steps.check.outputs.skip == 'false'
        run: |
          python3 << 'PYEOF'
          import json, os
          p = "data/chunks_metadata.json"
          if os.path.exists(p):
              with open(p, encoding="utf-8") as f:
                  raw = json.load(f)
              if raw and not isinstance(raw[0], dict):
                  fixed = [{"id": i, "text": str(m), "source": "unknown", "book": "unknown"} for i, m in enumerate(raw)]
                  with open(p, "w", encoding="utf-8") as f:
                      json.dump(fixed, f, ensure_ascii=False)
                  print(f"✅ Метаданные приведены к новому формату: {len(fixed)} чанков")
              else:
                  print("✅ Метаданные уже в новом формате")
          PYEOF

      - name: Compute summary
        id: summary
        if: steps.check.outputs.skip == 'false'
        run: |
          if [ -f data/summary.json ]; then
            BOOKS=$(python -c "import json; print(json.load(open('data/summary.json')).get('total_books', 0))" 2>/dev/null || echo 0)
            CHUNKS=$(python -c "import json; print(json.load(open('data/summary.json')).get('total_chunks', 0))" 2>/dev/null || echo 0)
            echo "books=${BOOKS}" >> $GITHUB_OUTPUT
            echo "chunks=${CHUNKS}" >> $GITHUB_OUTPUT
          else
            echo "books=0" >> $GITHUB_OUTPUT
            echo "chunks=0" >> $GITHUB_OUTPUT
          fi

      - name: Save fingerprint
        if: steps.check.outputs.skip == 'false'
        run: cp /tmp/new_fingerprint.txt data/last_train_fingerprint.txt

      - name: Delete trained PDFs from books
        if: steps.check.outputs.skip == 'false'
        run: |
          python3 << 'PYEOF'
          import json, os
          if not os.path.exists("data/faiss.index"):
              print("⚠️ Индекс не найден — очистка пропущена")
              raise SystemExit(0)
          with open("data/knowledge.json", encoding="utf-8") as f:
              know = json.load(f)
          files = {str(b.get("file")) for b in know.get("books", []) if b.get("file")}
          d = 0
          for name in os.listdir("books"):
              p = os.path.join("books", name)
              if os.path.isfile(p) and name in files:
                  os.remove(p)
                  d += 1
                  print("🗑️ Удалено:", name)
          print(f"CLEANUP OK: {d} PDF удалено, знания остались в knowledge.json")
          PYEOF

      - name: Commit and Push
        if: steps.check.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add data/ models/ books/ || true
          if git diff --staged --quiet; then
            echo "ℹ️ Нет изменений"
            exit 0
          fi
          git commit -m "ARGUS: auto-train [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "✅ Сохранено"
              break
            fi
            sleep 5
          done

  notify:
    needs: train
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify result
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SKIP_FLAG: ${{ needs.train.outputs.skip }}
          BOOKS: ${{ needs.train.outputs.books }}
          CHUNKS: ${{ needs.train.outputs.chunks }}
          TRAIN_RESULT: ${{ needs.train.result }}
        run: |
          if [ "${SKIP_FLAG}" = "true" ]; then
            TEXT="⏸️ Train пропущен"
          elif [ "${TRAIN_RESULT}" = "success" ]; then
            TEXT="🎓 Train завершён: книг ${BOOKS}, чанков ${CHUNKS}"
          else
            TEXT="❌ Train упал"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"${TEXT}\", \"parse_mode\": \"HTML\"}" || true
