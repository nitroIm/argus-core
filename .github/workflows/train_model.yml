name: ARGUS Train Model

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run_train]

permissions:
  contents: write

concurrency:
  group: argus-train-pipeline
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    outputs:
      skip: ${{ steps.check.outputs.skip }}
      books: ${{ steps.summary.outputs.books }}
      chunks: ${{ steps.summary.outputs.chunks }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-train-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: pip-train-

      - name: Cache HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5
          restore-keys: hf-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.2.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements.txt

      # ============================================================
      # ШАГ 1: ПРОВЕРКА НОВЫХ КНИГ (FINGERPRINT)
      # Если книг нет или они такие же как прошлый раз — пропускаем всё.
      # ============================================================
      - name: Check for new books
        id: check
        run: |
          mkdir -p data
          if [ ! -d books ] || [ -z "$(ls -A books 2>/dev/null)" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          CURRENT=$(find books -type f -exec md5sum {} + 2>/dev/null | sort | md5sum | cut -d' ' -f1)
          LAST=$(cat data/last_train_fingerprint.txt 2>/dev/null || echo "none")
          
          if [ "$CURRENT" = "$LAST" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ Новых книг нет"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "📚 Запуск обучения"
            echo "$CURRENT" > /tmp/new_fingerprint.txt
          fi

      # ============================================================
      # ШАГ 2: ИНГЕСТ (ЧТЕНИЕ PDF ИЗ BOOKS/)
      # ingest.py читает ВСЕ файлы из папки books/ и создает knowledge.json
      # ВАЖНО: Мы НЕ удаляем старые книги из папки books/. 
      # Поэтому ingest всегда видит полную историю знаний.
      # ============================================================
      - name: Ingest books
        if: steps.check.outputs.skip == 'false'
        run: python scripts/ingest.py

      # ============================================================
      # ШАГ 3: ОЧИСТКА СТАРОГО ИНДЕКСА
      # Удаляем faiss.index и metadata, чтобы build_index создал свежий
      # поверх актуальной базы знаний.
      # ============================================================
      - name: Clean old index artifacts
        if: steps.check.outputs.skip == 'false'
        run: |
          rm -f data/faiss.index
          rm -f data/chunks_metadata.json
          echo "✅ Старые артефакты удалены"

      # ============================================================
      # ШАГ 4: ОБУЧЕНИЕ ВЕКТОРОВ (ДЛЯ ВСЕЙ БАЗЫ)
      # train_embeddings.py теперь видит полный merged knowledge.json
      # Он прогонит модель по всем чанкам (старым и новым).
      # ============================================================
      - name: Train Embeddings
        if: steps.check.outputs.skip == 'false'
        run: python scripts/train_embeddings.py

      # ============================================================
      # ШАГ 5: ПОСТРОЕНИЕ ИНДЕКСА FAISS
      # build_index.py собирает финальный индекс из новых векторов.
      # Это гарантирует, что chunks_metadata.json будет заполнен правильно.
      # ============================================================
      - name: Build index
        if: steps.check.outputs.skip == 'false'
        run: python scripts/build_index.py

      # ============================================================
      # ШАГ 6: РАСЧЕТ СТАТИСТИКИ
      # Читаем summary.json для уведомления.
      # ============================================================
      - name: Compute summary
        id: summary
        if: steps.check.outputs.skip == 'false'
        run: |
          if [ -f data/summary.json ]; then
            BOOKS=$(python -c "import json; print(json.load(open('data/summary.json')).get('total_books', 0))" 2>/dev/null || echo 0)
            CHUNKS=$(python -c "import json; print(json.load(open('data/summary.json')).get('total_chunks', 0))" 2>/dev/null || echo 0)
            echo "books=${BOOKS}" >> $GITHUB_OUTPUT
            echo "chunks=${CHUNKS}" >> $GITHUB_OUTPUT
          else
            echo "books=0" >> $GITHUB_OUTPUT
            echo "chunks=0" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # ШАГ 7: СОХРАНЕНИЕ FINGERPRINT
      # Чтобы при следующем запуске система поняла, что книг больше нет.
      # ============================================================
      - name: Save fingerprint
        if: steps.check.outputs.skip == 'false'
        run: cp /tmp/new_fingerprint.txt data/last_train_fingerprint.txt

      # ============================================================
      # ШАГ 8: УДАЛЕНИЕ ОБУЧЕННЫХ PDF ИЗ PAPERBOX ВНУТРИ WORKFLOW
      # Так как текст теперь навсегда в knowledge.json, исходники не нужны
      # ============================================================
      - name: Delete trained PDFs from inbox
        if: steps.check.outputs.skip == 'false'
        run: |
          python3 << 'PYEOF'
          import json, os
          
          # Проверяем, что индекс реально построен
          if not os.path.exists("data/faiss.index"):
              print("⚠️ Индекс не найден — очистка PDF отменена (безопасность)")
              raise SystemExit(0)
          
          # Читаем список всех известных книг из итоговой базы знаний
          with open("data/knowledge.json", encoding="utf-8") as f:
              know = json.load(f)
          
          files_to_delete = set()
          for b in know.get("books", []):
              fname = b.get("file")
              if fname:
                  files_to_delete.add(str(fname))
          
          deleted_count = 0
          if os.path.isdir("books"):
              for filename in os.listdir("books"):
                  filepath = os.path.join("books", filename)
                  if os.path.isfile(filepath) and filename in files_to_delete:
                      os.remove(filepath)
                      deleted_count += 1
                      print(f"🗑️ Удалено: {filename}")
          
          print(f"CLEANUP DONE: {deleted_count} файлов удалено из books/")
          PYEOF

      # ============================================================
      # ШАГ 9: КОММИТ И PUSH
      # Сохраняем обновленную базу знаний, индекс и модели.
      # Папку books/ мы НЕ трогаем — она остается источником истины.
      # ============================================================
      - name: Commit and Push
        if: steps.check.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          
          # Добавляем только данные и модели. Книги остаются в репо навсегда.
          git add data/ models/ books/ || true
          
          if git diff --staged --quiet; then
            echo "ℹ️ Нет изменений для коммита."
            exit 0
          fi
          
          git commit -m "ARGUS: auto-train [skip ci]"
          
          # Надежный пуш с ретраями
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "✅ Все изменения успешно сохранены"
              break
            else
              echo "⚠️ Попытка $i не удалась, жду 5 секунд..."
              sleep 5
            fi
          done

  notify:
    needs: train
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify result
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SKIP_FLAG: ${{ needs.train.outputs.skip }}
          BOOKS: ${{ needs.train.outputs.books }}
          CHUNKS: ${{ needs.train.outputs.chunks }}
          TRAIN_RESULT: ${{ needs.train.result }}
        run: |
          if [ "${SKIP_FLAG}" = "true" ]; then
            TEXT="⏸️ Train пропущен (новых книг нет)"
          elif [ "${TRAIN_RESULT}" = "success" ]; then
            TEXT="🎓 Train завершён!\nКниг: ${BOOKS}, Чанков: ${CHUNKS}\nБаза знаний обновлена."
          else
            TEXT="❌ Train упал\nПроверь логи в Actions."
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"${TEXT}\", \"parse_mode\": \"HTML\"}" || true
