name: ARGUS Train Model

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # каждые 6 часов — проверка новых книг

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-train-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: pip-train-

      - name: Cache HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-e5-small-v1
          restore-keys: hf-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.2.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements.txt

      - name: Check for new books
        id: check
        run: |
          mkdir -p data
          if [ ! -d books ] || [ -z "$(ls -A books 2>/dev/null)" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "📭 Нет книг в books/"
            exit 0
          fi
          CURRENT=$(ls -la books/ | md5sum | cut -d' ' -f1)
          LAST=$(cat data/last_train_fingerprint.txt 2>/dev/null || echo "none")
          echo "current=$CURRENT"
          echo "last=$LAST"
          if [ "$CURRENT" = "$LAST" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ Новых книг нет — Train пропущен."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "📚 Есть новые книги — запускаю Train."
          fi
          echo "$CURRENT" > /tmp/new_fingerprint.txt

      - name: Ingest books
        if: steps.check.outputs.skip == 'false'
        run: python scripts/ingest.py

      - name: Build index
        if: steps.check.outputs.skip == 'false'
        run: python scripts/build_index.py

      - name: Save fingerprint
        if: steps.check.outputs.skip == 'false'
        run: cp /tmp/new_fingerprint.txt data/last_train_fingerprint.txt

      - name: Commit
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "ARGUS: train $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main || true
          git push || true

      - name: Notify
        if: steps.check.outputs.skip == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🎓 ARGUS: Train завершён, индекс обновлён." \
            -d "parse_mode=HTML"