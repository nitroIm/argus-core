name: ARGUS Train Model

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: argus-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v2

      - name: Install CPU torch
        run: |
          pip install torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build index
        run: python scripts/build_index.py

      - name: Commit index
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add data/
          git diff --staged --quiet && echo "Нет изменений" && exit 0
          git commit -m "ARGUS: обновил FAISS-индекс [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            git push && break
            sleep 5
          done