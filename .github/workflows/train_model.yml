name: ARGUS Train Model

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run_train]
  # schedule:
  #   - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: argus-train-pipeline
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      books: ${{ steps.summary.outputs.books }}
      chunks: ${{ steps.summary.outputs.chunks }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-train-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: pip-train-

      - name: Cache HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5
          restore-keys: hf-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.2.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements.txt

      - name: Check for new books
        id: check
        run: |
          mkdir -p data
          if [ ! -d books ] || [ -z "$(ls -A books 2>/dev/null)" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "📭 Нет книг в books/"
            exit 0
          fi
          
          CURRENT=$(find books -type f -exec md5sum {} + 2>/dev/null | sort | md5sum | cut -d' ' -f1)
          LAST=$(cat data/last_train_fingerprint.txt 2>/dev/null || echo "none")
          
          echo "current=${CURRENT}"
          echo "last=${LAST}"
          
          if [ "$CURRENT" = "$LAST" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ Новых книг нет — Train пропущен."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "📚 Есть новые книги — запускаю полный цикл."
            echo "$CURRENT" > /tmp/new_fingerprint.txt
          fi

      - name: Ingest books
        if: steps.check.outputs.skip == 'false'
        run: python scripts/ingest.py

      - name: Train Embeddings
        if: steps.check.outputs.skip == 'false'
        run: python scripts/train_embeddings.py

      - name: Build index
        if: steps.check.outputs.skip == 'false'
        run: python scripts/build_index.py

      - name: Compute summary
        id: summary
        if: steps.check.outputs.skip == 'false'
        run: |
          if [ -f data/summary.json ]; then
            BOOKS=$(python -c "import json; print(json.load(open('data/summary.json')).get('total_books', 0))" 2>/dev/null || echo 0)
            CHUNKS=$(python -c "import json; print(json.load(open('data/summary.json')).get('total_chunks', 0))" 2>/dev/null || echo 0)
            echo "books=${BOOKS}" >> $GITHUB_OUTPUT
            echo "chunks=${CHUNKS}" >> $GITHUB_OUTPUT
          else
            echo "books=0" >> $GITHUB_OUTPUT
            echo "chunks=0" >> $GITHUB_OUTPUT
          fi

      - name: Save fingerprint
        if: steps.check.outputs.skip == 'false'
        run: cp /tmp/new_fingerprint.txt data/last_train_fingerprint.txt
      
      - name: Save fingerprint
        if: steps.check.outputs.skip == 'false'
        run: cp /tmp/new_fingerprint.txt data/last_train_fingerprint.txt

      # 🆕 НОВЫЙ ШАГ: Безопасная очистка успешно обученных книг
      - name: Cleanup processed books
        if: steps.check.outputs.skip == 'false'
        run: python scripts/cleanup_processed_books.py

      - name: Commit and Push
        if: steps.check.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          
          # Безопасно добавляем изменения (включая удаление файлов из books/)
          git add data/ models/ books/ || true
          
          if git diff --staged --quiet; then
            echo "ℹ️ Нет изменений для коммита."
            exit 0
          fi
          
          echo "Есть изменения. Коммичу и пушу..."
          git commit -m "ARGUS: auto-train & cleanup [skip ci]"
          
          # Надежный пуш с обработкой конфликтов
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "✅ Обучение и очистка успешно сохранены в репозиторий"
              break
            else
              echo "⚠️ Попытка $i не удалась, жду 5 секунд..."
              sleep 5
            fi
          done

      - name: Commit and Push
        if: steps.check.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          
          # Безопасно добавляем только целевые директории
          git add data/ models/ books/ || true
          
          if git diff --staged --quiet; then
            echo "ℹ️ Нет изменений для коммита."
            exit 0
          fi
          
          echo "Есть изменения. Коммичу и пушу..."
          git commit -m "ARGUS: auto-train [skip ci]"
          
          # Надежный пуш с обработкой конфликтов
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "✅ Обучение успешно сохранено в репозиторий"
              break
            else
              echo "⚠️ Попытка $i не удалась, жду 5 секунд..."
              sleep 5
            fi
          done

  notify:
    needs: train
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify result
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SKIP_FLAG: ${{ needs.train.outputs.skip }}
          BOOKS: ${{ needs.train.outputs.books }}
          CHUNKS: ${{ needs.train.outputs.chunks }}
          TRAIN_RESULT: ${{ needs.train.result }}
        run: |
          if [ "${SKIP_FLAG}" = "true" ]; then
            TEXT="⏸️ <b>Train пропущен</b>\nНовых книг не обнаружено."
          elif [ "${TRAIN_RESULT}" = "success" ]; then
            TEXT="🎓 <b>Train завершён</b>\nКниг: ${BOOKS}, чанков: ${CHUNKS}."
          else
            TEXT="❌ <b>Train упал</b>\nПроверь логи в Actions."
          fi
          
          # Используем JSON для надежной отправки \n и HTML
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"${TEXT}\", \"parse_mode\": \"HTML\"}" || echo "notify failed"
