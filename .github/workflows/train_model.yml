name: ARGUS Train Model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU torch
        run: |
          pip install torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Train embeddings
        run: python scripts/train_embeddings.py

      - name: Build FAISS index
        run: python scripts/build_index.py

      - name: Commit model
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add models/ data/
          git commit -m "ARGUS: обновил модель и индекс" || echo "Нет изменений"
          git pull --rebase origin main
          git push