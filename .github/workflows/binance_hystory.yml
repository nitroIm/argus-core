name: Binance History

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas pyarrow numpy
      - name: Download history
        run: python crypto/collect/binance_history.py
      - name: Verify history
        run: python crypto/collect/verify_history.py
      - name: Commit parquet to repo
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add crypto/collect/vision_out/ || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "ARGUS: binance vision data [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs \
              --autostash origin main || true
            if git push origin main; then
              echo "Push OK"
              break
            fi
            echo "Retry $i"
            sleep 5
          done