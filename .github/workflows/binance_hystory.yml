name: Binance History

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas pyarrow numpy
      - name: Download history
        run: python crypto/collect/binance_history.py
      - name: Verify history
        run: python crypto/collect/verify_history.py
      - uses: actions/upload-artifact@v4
        with:
          name: vision-out
          path: crypto/collect/vision_out/
          retention-days: 30