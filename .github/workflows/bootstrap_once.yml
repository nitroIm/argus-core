# ============================================================
# ARGUS - BOOTSTRAP ONCE
# ------------------------------------------------------------
# v2: STEP 2 (features.py v8) — добавлен ARGUS_DB_URL_2,
#     SYMBOLS (4 монеты), DB2_SYMBOLS. Иначе SOL/BNB пропуск.
# v1: разовый прогон — candles + features + enrich + train.
# ============================================================

name: ARGUS Bootstrap Once

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: argus-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-bootstrap-${{ hashFiles('crypto/requirements.txt') }}
          restore-keys: pip-bootstrap-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r crypto/requirements.txt

      - name: STEP 1 — Bootstrap candles
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          ARGUS_DB_URL_2: ${{ secrets.ARGUS_DB_URL_2 }}
        run: python crypto/collect/bootstrap_candles.py

      - name: STEP 2 — Features (all history)
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          ARGUS_DB_URL_2: ${{ secrets.ARGUS_DB_URL_2 }}
          FEATURES_BOOTSTRAP: '1'
          SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
          DB2_SYMBOLS: SOLUSDT,BNBUSDT
        run: python crypto/enrich/features.py

      - name: STEP 3 — Enrich chain
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          ARGUS_DB_URL_2: ${{ secrets.ARGUS_DB_URL_2 }}
        run: python crypto/enrich/runner.py

      - name: STEP 4 — Retrain model
        env:
          ARGUS_DB_URL: ${{ secrets.ARGUS_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          rm -f crypto/learn/models/model_meta.json
          python crypto/learn/runner.py

      - name: STEP 5 — Commit artifacts
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add crypto/learn/models/ || true
          git add crypto/learn/export/ || true
          git add crypto/learn/last_predictions.json || true
          git add crypto/learn/last_signals.json || true
          git add crypto/data/ || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "ARGUS: bootstrap once [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs \
              --autostash origin main || true
            if git push origin main; then
              break
            fi
            sleep 5
          done

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"Bootstrap упал\", \"parse_mode\": \"HTML\"}" || true